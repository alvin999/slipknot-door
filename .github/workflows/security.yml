name: Security & Vulnerability Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 每週一 UTC 02:00 自動執行弱點與供應鏈掃描
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. 前端與 Rust 依賴套件弱點掃描 (SCA)
  dependency-audit:
    name: Dependency Audit (npm & Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit (high/critical)
        run: npm audit --audit-level=high

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@f640219c6a325c6b06441c137b1716549be12b2c # stable

      - name: Run cargo-audit
        uses: rustsec/audit-check@01798b602f09a4e531d52f1c7e4fd6373f5b42e1 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cargo-lock-path: src-tauri/Cargo.lock

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@159f2cb8a6a4d0ef9dc7d5d6b7d42913221d6d4b # v2.0.12
        with:
          arguments: --manifest-path src-tauri/Cargo.toml check

  # 2. Rust 靜態程式碼品質與安全性檢查
  rust-clippy:
    name: Rust Clippy & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@f640219c6a325c6b06441c137b1716549be12b2c
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: "./src-tauri"

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Run cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

  # 3. Git 歷史與程式庫機密外洩掃描
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. SAST 靜態安全分析 (CodeQL: JavaScript/TypeScript + Rust)
  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux system dependencies for Rust build
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b5ebac6f7865c29064b4b2520f24d476c5d0586d # v3.28.18
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@b5ebac6f7865c29064b4b2520f24d476c5d0586d # v3.28.18

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b5ebac6f7865c29064b4b2520f24d476c5d0586d # v3.28.18
        with:
          category: "/language:${{ matrix.language }}"

  # 5. Trivy 檔案系統弱掃與配置檢查
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability & misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.30.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b5ebac6f7865c29064b4b2520f24d476c5d0586d # v3.28.18
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # 6. OpenSSF Scorecard（僅於 push main 或排程時執行，產生開源安全評分）
  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b5ebac6f7865c29064b4b2520f24d476c5d0586d # v3.28.18
        with:
          sarif_file: results.sarif
